# =============================================================================
# Spins up:
#   - api : the ASP.NET Core Web API (built from the ../Dockerfile)
#   - db  : a PostgreSQL instance used by the API (via EF Core / Npgsql)
# =============================================================================

name: jdb-portfolio-api

services:
  db:
    image: postgres:16-alpine
    container_name: jdb_portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jdb_portfolio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jdb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-jdb_portfolio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jdb_network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: jdb-portfolio-api:latest
    container_name: jdb_portfolio_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "Development" enables Swagger UI; set to Production for deployments.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # The container always listens on plain HTTP at 8080.
      ASPNETCORE_URLS: http://+:8080

      # `__` separators map to `:` config sections, so these bind the app's
      # Jwt:* / Notion:* sections (see ConfigurationSettings.cs). Values come
      # from docker/.env; the ":?" form fails fast if a required var is missing.
      Notion__Version: ${Notion__Version:-2026-03-11}
      Notion__Token: ${Notion__Token:?}

      Jwt__Key: ${Jwt__Key:?}
      Jwt__Issuer: ${Jwt__Issuer:?}
      Jwt__Audience: ${Jwt__Audience:?}
      Jwt__ExpirationInMinutes: ${Jwt__ExpirationInMinutes:-60}

      # Connection string for the containerized PostgreSQL ("db" service).
      # Built from the POSTGRES_* vars in docker/.env so it ALWAYS targets the
      # compose "db" service over the internal network - never "localhost".
      ConnectionStrings__JDBConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    ports:
      # Host port configurable via API_PORT; container port is always 8080.
      - "${API_PORT:-8080}:8080"
    networks:
      - jdb_network

networks:
  jdb_network:
    driver: bridge

volumes:
  jdb_pgdata: