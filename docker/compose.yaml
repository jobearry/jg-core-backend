# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose/reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the repository root context.
services:
  server:
    build:
      context: .
      dockerfile: docker/JGBackend.Dockerfile
      target: final
    ports:
      - 5031:8080
    environment:
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__ExpirationInMinutes=${Jwt__ExpirationInMinutes:-60}

      - ConnectionStrings__JDBConnection=${ConnectionStrings__JDBConnection:?}
      - Notion__Version=${Notion__Version:-2026-03-11}
      - Notion__Token=${Notion__Token:?}
      - Github__Token=${Github__Token:?}
      - Github__BaseUrl=${Github__BaseUrl:-https://api.github.com}

      - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT}
