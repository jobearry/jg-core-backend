name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore JGBackend.sln

      - name: Build
        run: dotnet build JGBackend.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test JGBackend.sln --configuration Release --no-build
